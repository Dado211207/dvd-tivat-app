<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Operativna aplikacija za pozive, odzive i evidenciju DVD Tivat."
    />
    <!-- A prototype with fictional data has no business in a search result. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- The browser chrome follows the application's own surface colour, which
         differs between the light and dark palettes. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#077687" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1620" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boka Operativa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Boka Operativa</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Ova stranica zahtijeva JavaScript za operativni pregled. Nije kanal za prijavu hitnih
      slucajeva - kod pozara ili nesrece pozovite zvanicnu vatrogasnu sluzbu telefonom.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
