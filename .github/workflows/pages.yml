name: Deploy demonstration build

# Publishes the prototype to GitHub Pages, which is free for a public
# repository. No paid infrastructure and nothing is purchased.
#
# WHAT THIS DEPLOYMENT IS. A demonstration against a Supabase project that
# holds only fictional members, fictional accounts and clearly labelled
# exercises. Optional Web Push is enabled only for devices that explicitly opt
# in; there is no email, SMS, Viber or telephone transport. Provider acceptance
# is recorded separately from a member opening the call-out.
#
# WHAT GOES INTO THE BUNDLE. The project URL and the PUBLISHABLE key, both of
# which every Supabase browser application ships and neither of which grants
# anything on its own - `anon` holds no table privilege and no executable
# function in this schema. They are read from repository VARIABLES and are
# deliberately not committed: this repository keeps placeholder configuration
# only, and the owner can repoint the deployment without a code change.
#
# The SECRET key must never appear here, in a variable, in a secret consumed by
# this workflow, or anywhere else the build can read; `npm run verify:bundle`
# fails the job if anything of the sort reaches the output.
#
# Setting the two required public variables is a one-time step, described in
# docs/DEMO_RUNBOOK.md. A third, VITE_WEB_PUSH_PUBLIC_KEY, is optional: without
# it the application deploys and works exactly as before, and simply offers no
# Web Push opt-in.
# Without them this workflow fails early and loudly rather than publishing a
# copy that looks right and refuses every operational screen.
#
# Deployment is manual (`workflow_dispatch`) or on a push to main that has
# already passed CI. It never runs from a pull request, so a fork cannot publish.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a superseded one is not worth finishing, but an
# in-flight one is never cancelled half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demonstration bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A red CI run must not be able to reach the demonstration URL.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail early if the project is not configured
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_PASSWORD_RESET_ENABLED: ${{ vars.VITE_PASSWORD_RESET_ENABLED }}
          VITE_MULTI_SERVICE_ADMIN_ENABLED: ${{ vars.VITE_MULTI_SERVICE_ADMIN_ENABLED }}
        run: |
          # Without these the deployed copy would look like the application but
          # refuse every operational screen, which is worse than not deploying:
          # somebody would demonstrate it and discover the fault on stage.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the repository variables VITE_SUPABASE_URL and" \
                 "VITE_SUPABASE_PUBLISHABLE_KEY (Settings -> Secrets and variables" \
                 "-> Actions -> Variables). See docs/DEMO_RUNBOOK.md."
            exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*)
              echo "::error::That is a SECRET key. Only the publishable key may be built in."
              exit 1 ;;
          esac
          # Web Push is OPTIONAL, and the deployment must not depend on it.
          #
          # Requiring this variable made a missing push key fatal to publishing
          # the whole application - which is wrong twice over: the society's
          # call-out screens have nothing to do with push, and the application
          # itself already treats an unset key as a supported state, reporting
          # NOT_CONFIGURED and offering no opt-in. A pipeline that refuses what
          # the code handles is a pipeline that stops a deployment for no
          # reason, most likely on the evening somebody needs it.
          #
          # Set, it must still be a real unpadded P-256 public key: a malformed
          # one would ship a build whose subscribe call fails on every device.
          if [ -z "$VITE_WEB_PUSH_PUBLIC_KEY" ]; then
            echo "::warning::VITE_WEB_PUSH_PUBLIC_KEY is not set." \
                 "Deploying without Web Push: the call-out screens work as" \
                 "before and the notification panel will say it is not connected."
          elif ! printf '%s' "$VITE_WEB_PUSH_PUBLIC_KEY" | grep -Eq '^[A-Za-z0-9_-]{87}$'; then
            echo "::error::VITE_WEB_PUSH_PUBLIC_KEY is not a valid unpadded P-256 public key."
            exit 1
          fi
          # A private key must never reach a build. The public VAPID key is 87
          # characters; anything longer presented here is not one.
          case "$VITE_WEB_PUSH_PUBLIC_KEY" in
            *BEGIN*PRIVATE*|*' '*)
              echo "::error::That does not look like a public VAPID key. Only the public key may be built in."
              exit 1 ;;
          esac
          case "$VITE_PASSWORD_RESET_ENABLED" in
            ''|false|true) ;;
            *)
              echo "::error::VITE_PASSWORD_RESET_ENABLED must be true, false or unset."
              exit 1 ;;
          esac
          case "$VITE_MULTI_SERVICE_ADMIN_ENABLED" in
            ''|false|true) ;;
            *)
              echo "::error::VITE_MULTI_SERVICE_ADMIN_ENABLED must be true, false or unset."
              exit 1 ;;
          esac

      - name: Point the build at the configured project
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_PASSWORD_RESET_ENABLED: ${{ vars.VITE_PASSWORD_RESET_ENABLED }}
          VITE_MULTI_SERVICE_ADMIN_ENABLED: ${{ vars.VITE_MULTI_SERVICE_ADMIN_ENABLED }}
        run: |
          # Written to a .env file rather than passed as environment variables:
          # an empty environment variable silently overrides everything else,
          # which is how a build ends up unconfigured without saying so.
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
            printf 'VITE_WEB_PUSH_PUBLIC_KEY=%s\n' "$VITE_WEB_PUSH_PUBLIC_KEY"
            printf 'VITE_PASSWORD_RESET_ENABLED=%s\n' "${VITE_PASSWORD_RESET_ENABLED:-false}"
            printf 'VITE_MULTI_SERVICE_ADMIN_ENABLED=%s\n' "${VITE_MULTI_SERVICE_ADMIN_ENABLED:-false}"
          } > .env.production.local

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time, so publishing needs no click in
          # Settings. Harmless afterwards.
          enablement: true

      - name: Build
        run: npm run build

      - name: Refuse to publish a bundle containing a secret
        run: npm run verify:bundle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
