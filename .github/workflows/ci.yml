name: CI

# Standard GitHub-hosted runners only. No paid infrastructure, no self-hosted
# runners, no external services.
# Pushes to a branch with an open pull request are covered by the pull_request
# trigger. Listening to both would run the whole suite twice for one commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push should not run a second full suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit, database and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A standard GitHub-hosted service container, included in the runner at no
    # extra cost. It gives the migrations and every row-level-security policy a
    # real PostgreSQL to execute against, so the access model is verified rather
    # than reviewed. No Supabase project, credentials or paid service involved.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Applies every migration to an empty database and asserts the role
      # matrix, intervention lifecycle, attendance invariants and the table and
      # function privileges the client roles hold.
      #
      # This is the authoritative automated evidence for the access model. It
      # runs against this service container and NEVER against the owner's hosted
      # Supabase project - reaching that would need a secret in CI, which this
      # repository deliberately does not have. No result here is a claim about
      # the hosted project.
      - name: Database and row-level-security tests
        run: npm run test:db
        env:
          DVD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: npx vite build

      # Vite inlines every VITE_* variable into the output, silently. This reads
      # the artifact that would actually ship, which is the only place that
      # mistake becomes real.
      - name: Check no secret reached the bundle
        run: npm run verify:bundle

      # Chromium only: installing three engines costs minutes on a hosted
      # runner for no extra signal at this stage.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npx playwright test --grep-invert @screenshots

      # Review files only: nothing is deployed or written back to the branch.
      - name: Capture prototype review screenshots
        run: npm run screenshots

      - name: Upload prototype review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: prototype-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
