name: CI

# Standard GitHub-hosted runners only. No paid infrastructure, no self-hosted
# runners, no external services.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A superseded push should not run a second full suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build

      # Chromium only: installing three engines costs minutes on a hosted
      # runner for no extra signal at this stage.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The screenshot spec writes into docs/ and is excluded here; it is run
      # locally when the images need regenerating.
      - name: Browser and accessibility tests
        run: npx playwright test --grep-invert @screenshots

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
