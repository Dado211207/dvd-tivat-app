name: CI

# Standard GitHub-hosted runners only. No paid infrastructure, no self-hosted
# runners, no external services.
# Pushes to a branch with an open pull request are covered by the pull_request
# trigger. Listening to both would run the whole suite twice for one commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push should not run a second full suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build

      # Chromium only: installing three engines costs minutes on a hosted
      # runner for no extra signal at this stage.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npx playwright test --grep-invert @screenshots

      # Review files only: nothing is deployed or written back to the branch.
      - name: Capture prototype review screenshots
        run: npm run screenshots

      - name: Upload prototype review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: prototype-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
